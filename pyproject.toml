[project]
name = "banking-e2e-tests"
version = "1.0.0"
description = "Playwright E2E test suite for the Banking Project demo application"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "playwright>=1.56.0",
    "pytest>=8.0",
    "pytest-playwright>=0.5.0",
    "pytest-html>=4.0",
    "pytest-reportportal>=5.0",
]

[project.scripts]
run-tests = "run_tests:main"

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-v --tb=short"
markers = [
    "smoke: smoke tests (default, single user)",
    "full: full run (parametrized over all customers)",
    "manager: manager CRUD tests",
]
